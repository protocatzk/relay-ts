#   cp docker-compose.override.example.yml docker-compose.override.yml
services:
  restreamer-ts:
    environment:
      VIRTUAL_HOST: relay.example.com
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: relay.example.com
      LETSENCRYPT_EMAIL: admin@example.com
    networks:
      - default
      - toktrackerapp_toktracker_net

networks:
  toktrackerapp_toktracker_net:
    external: true
