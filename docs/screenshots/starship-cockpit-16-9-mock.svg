<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Space / 16:9 Video Simulation Gradients -->
    <linearGradient id="landscape-stream-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="40%" stop-color="#18233c" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Planet / Nebula Atmosphere Glow for 16:9 Stream Background -->
    <radialGradient id="nebula-glow" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glass HUD Gradients (Semi-Transparent Carbon Slate) -->
    <linearGradient id="hud-glass-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0.94" />
    </linearGradient>

    <linearGradient id="top-visor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.96" />
      <stop offset="85%" stop-color="#0b1120" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="green-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="radar-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .hud-label { font-size: 9px; font-weight: 700; fill: #64748b; letter-spacing: 0.12em; text-transform: uppercase; }
    .hud-val-cyan { font-size: 13px; font-weight: 800; fill: #00f0ff; letter-spacing: 0.05em; }
    .hud-val-green { font-size: 13px; font-weight: 800; fill: #00ff88; letter-spacing: 0.05em; }
    .hud-val-amber { font-size: 13px; font-weight: 800; fill: #f59e0b; letter-spacing: 0.05em; }
  </style>

  <!-- ===================================================================== -->
  <!-- 16:9 FULLSCREEN STREAM VIDEO LAYER (Simulated Gameplay / Landscape)   -->
  <!-- ===================================================================== -->
  <rect width="1280" height="720" fill="url(#landscape-stream-grad)" />
  <rect width="1280" height="720" fill="url(#nebula-glow)" />
  <rect width="1280" height="720" fill="url(#radar-grid)" />

  <!-- Center Crosshairs / Reticle of 16:9 Cockpit Canopy -->
  <circle cx="640" cy="360" r="140" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="4 8" />
  <circle cx="640" cy="360" r="4" fill="#00f0ff" fill-opacity="0.4" />
  <path d="M 600 360 L 630 360 M 650 360 L 680 360 M 640 320 L 640 350 M 640 370 L 640 400" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25" />
  <text x="640" y="390" text-anchor="middle" class="font-mono" font-size="10" fill="#64748b" fill-opacity="0.5">[ 16:9 LANDSCAPE VIEWPORT // ZERO OCCLUSION CORE ]</text>

  <!-- ===================================================================== -->
  <!-- STARSHIP COCKPIT CANOPY FRAME & CORNER STRUTS (Pre-Rendered Once)     -->
  <!-- ===================================================================== -->
  
  <!-- Outer Cockpit Glass Bezel Brackets -->
  <!-- Top-Left Corner Strut -->
  <path d="M 0 0 L 80 0 L 110 30 L 30 30 L 0 60 Z" fill="#090d16" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="20" cy="18" r="2.5" fill="#00f0ff" />

  <!-- Top-Right Corner Strut -->
  <path d="M 1280 0 L 1200 0 L 1170 30 L 1250 30 L 1280 60 Z" fill="#090d16" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="1260" cy="18" r="2.5" fill="#00f0ff" />

  <!-- Bottom-Left Corner Strut -->
  <path d="M 0 720 L 70 720 L 95 695 L 25 695 L 0 670 Z" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  
  <!-- Bottom-Right Corner Strut -->
  <path d="M 1280 720 L 1210 720 L 1185 695 L 1255 695 L 1280 670 Z" fill="#090d16" stroke="#1e293b" stroke-width="1" />

  <!-- Glass Sheen Corner Highlights -->
  <path d="M 0 120 L 120 0 M 0 140 L 140 0" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.08" />

  <!-- ===================================================================== -->
  <!-- TOP VISOR HUD (Flight Telemetry Header, Height 46px)                  -->
  <!-- ===================================================================== -->
  <g transform="translate(120, 8)">
    <!-- Visor Container -->
    <path d="M 0 0 L 1040 0 L 1025 44 L 15 44 Z" fill="url(#top-visor-grad)" stroke="#1e293b" stroke-width="1" />
    <line x1="15" y1="44" x2="1025" y2="44" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Left: Status & Callsign -->
    <rect x="25" y="12" width="46" height="20" rx="2" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
    <circle cx="34" cy="22" r="3" fill="#ef4444" filter="url(#neon-glow)" />
    <text x="44" y="26" class="font-mono" font-size="10" font-weight="800" fill="#ffffff">LIVE</text>
    
    <text x="82" y="26" class="font-sans" font-size="12" font-weight="800" fill="#ffffff">STARSHIP ODYSSEY</text>
    <text x="215" y="26" class="font-mono" font-size="10" fill="#00ff88">● 1,482 CREW</text>
    <text x="315" y="26" class="font-mono" font-size="10" fill="#64748b">SYS: STABLE</text>

    <!-- Center: Mission Elapsed Time (MET) -->
    <rect x="420" y="8" width="200" height="28" rx="2" fill="#060911" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="430" y="20" class="font-mono" font-size="7" fill="#64748b" letter-spacing="0.1em">MISSION ELAPSED TIME</text>
    <text x="430" y="32" class="font-mono" font-size="13" font-weight="800" fill="#00f0ff" letter-spacing="0.08em">04:18:22.4 MET</text>
    <rect x="585" y="14" width="24" height="16" rx="2" fill="#00ff88" fill-opacity="0.15" />
    <text x="597" y="25" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#00ff88">CFR</text>

    <!-- Right: Power Grid / Goal Progress -->
    <text x="655" y="22" class="font-mono" font-size="8" fill="#64748b">ENERGY / GOAL</text>
    <text x="655" y="34" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">18,500 COINS <tspan fill="#00ff88">(97.12 €)</tspan></text>
    
    <!-- Progress Bar -->
    <rect x="800" y="21" width="160" height="8" rx="2" fill="#1e293b" />
    <rect x="800" y="21" width="131" height="8" rx="2" fill="url(#green-accent)" />
    <text x="970" y="29" class="font-mono" font-size="10" font-weight="800" fill="#00ff88">82%</text>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM-LEFT HUD: TACTICAL COMMS UPLINK (Chat Glass Widget)            -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 440)">
    <!-- Glass Backdrop -->
    <path d="M 0 0 L 360 0 L 375 15 L 375 250 L 0 250 Z" fill="url(#hud-glass-dark)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="360" y2="0" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- Header -->
    <rect x="12" y="10" width="350" height="24" rx="2" fill="#090d16" />
    <circle cx="24" cy="22" r="3" fill="#00f0ff" />
    <text x="35" y="26" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">COMMS TERMINAL // CHAT</text>
    <text x="310" y="26" class="font-mono" font-size="9" fill="#00ff88">LIVE 4.2/s</text>

    <!-- Chat Message 1 -->
    <g transform="translate(12, 44)">
      <rect width="350" height="42" rx="2" fill="#0c1222" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="17" class="font-mono" font-size="8" fill="#64748b">20:14:02</text>
      <rect x="58" y="8" width="30" height="13" rx="2" fill="#3b82f6" fill-opacity="0.25" />
      <text x="73" y="18" text-anchor="middle" class="font-mono" font-size="7" font-weight="800" fill="#60a5fa">VIP</text>
      <text x="95" y="18" class="font-sans" font-size="10" font-weight="700" fill="#38bdf8">MajorTom</text>
      <text x="10" y="33" class="font-sans" font-size="10" fill="#e2e8f0">16:9 Cockpit-Layout sieht unfassbar clean aus! 🔥</text>
    </g>

    <!-- Chat Message 2 -->
    <g transform="translate(12, 92)">
      <rect width="350" height="42" rx="2" fill="#0c1222" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="17" class="font-mono" font-size="8" fill="#64748b">20:14:15</text>
      <rect x="58" y="8" width="30" height="13" rx="2" fill="#00ff88" fill-opacity="0.25" />
      <text x="73" y="18" text-anchor="middle" class="font-mono" font-size="7" font-weight="800" fill="#00ff88">SUB</text>
      <text x="95" y="18" class="font-sans" font-size="10" font-weight="700" fill="#a78bfa">NebulaRider</text>
      <text x="10" y="33" class="font-sans" font-size="10" fill="#e2e8f0">Null Bildverdeckung im Gameplay-Zentrum.</text>
    </g>

    <!-- Chat Message 3 -->
    <g transform="translate(12, 140)">
      <rect width="350" height="42" rx="2" fill="#0c1222" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="17" class="font-mono" font-size="8" fill="#64748b">20:14:28</text>
      <rect x="58" y="8" width="30" height="13" rx="2" fill="#f59e0b" fill-opacity="0.25" />
      <text x="73" y="18" text-anchor="middle" class="font-mono" font-size="7" font-weight="800" fill="#fbbf24">MOD</text>
      <text x="95" y="18" class="font-sans" font-size="10" font-weight="700" fill="#f43f5e">FlightDirector</text>
      <text x="10" y="33" class="font-sans" font-size="10" fill="#e2e8f0">Alle Telemetriesysteme grün. Sink stabil.</text>
    </g>

    <!-- Chat Message 4 (Incoming) -->
    <g transform="translate(12, 188)">
      <rect width="350" height="42" rx="2" fill="#0c1222" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="17" class="font-mono" font-size="8" fill="#64748b">20:14:41</text>
      <text x="10" y="33" class="font-sans" font-size="10" fill="#94a3b8">Alpha-Test läuft auf Server mit &lt;1.5% CPU.</text>
    </g>

    <text x="12" y="242" class="font-mono" font-size="8" fill="#475569">RENDER: DELTA-BLIT EVENT-DRIVEN // 0% IDLE LOAD</text>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM-RIGHT HUD: TELEMETRY & FLIGHT VECTORS WIDGET                  -->
  <!-- ===================================================================== -->
  <g transform="translate(880, 440)">
    <!-- Glass Backdrop -->
    <path d="M 15 0 L 375 0 L 375 250 L 0 250 L 0 15 Z" fill="url(#hud-glass-dark)" stroke="#1e293b" stroke-width="1" />
    <line x1="15" y1="0" x2="375" y2="0" stroke="#00ff88" stroke-width="2" stroke-opacity="0.8" />

    <!-- Header -->
    <rect x="12" y="10" width="350" height="24" rx="2" fill="#090d16" />
    <circle cx="24" cy="22" r="3" fill="#00ff88" />
    <text x="35" y="26" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">TELEMETRY &amp; FLIGHT VECTORS</text>
    <text x="315" y="26" class="font-mono" font-size="9" fill="#00f0ff">ONLINE</text>

    <!-- Instruments Grid Row 1 -->
    <g transform="translate(12, 44)">
      <!-- Ingest Bitrate Gauge -->
      <rect width="170" height="60" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="16" class="font-mono hud-label">INGEST BITRATE</text>
      <text x="10" y="38" class="font-mono hud-val-cyan">5,120</text>
      <text x="65" y="38" class="font-mono" font-size="10" fill="#64748b">kbps</text>
      <rect x="10" y="46" width="150" height="5" rx="1" fill="#1e293b" />
      <rect x="10" y="46" width="125" height="5" rx="1" fill="url(#cyan-accent)" />

      <!-- Sink Bitrate Gauge -->
      <rect x="180" width="170" height="60" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="190" y="16" class="font-mono hud-label">SINK CFR FPS</text>
      <text x="190" y="38" class="font-mono hud-val-green">60.00</text>
      <text x="245" y="38" class="font-mono" font-size="10" fill="#64748b">fps</text>
      <rect x="190" y="46" width="150" height="5" rx="1" fill="#1e293b" />
      <rect x="190" y="46" width="150" height="5" rx="1" fill="url(#green-accent)" />
    </g>

    <!-- Instruments Grid Row 2: Delay Buffer & Audio Resample -->
    <g transform="translate(12, 112)">
      <rect width="350" height="54" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="16" class="font-mono hud-label">DELAY BUFFER // PACING DRIFT</text>
      <text x="12" y="34" class="font-mono" font-size="12" font-weight="800" fill="#ffffff">150 ms <tspan fill="#64748b">(Catchup 1.01x · Drift 0.0ms)</tspan></text>
      
      <!-- Segmented Thruster / Buffer Bar -->
      <rect x="12" y="40" width="46" height="4" fill="#00ff88" />
      <rect x="62" y="40" width="46" height="4" fill="#00ff88" />
      <rect x="112" y="40" width="46" height="4" fill="#00ff88" />
      <rect x="162" y="40" width="46" height="4" fill="#00ff88" />
      <rect x="212" y="40" width="46" height="4" fill="#00f0ff" />
      <rect x="262" y="40" width="46" height="4" fill="#1e293b" />
      <rect x="312" y="40" width="40" height="4" fill="#1e293b" />
    </g>

    <!-- Status Annunciator Matrix Row 3 -->
    <g transform="translate(12, 174)">
      <rect width="82" height="34" rx="2" fill="#090d16" stroke="#00ff88" stroke-width="0.8" />
      <text x="8" y="15" class="font-mono" font-size="8" fill="#00ff88">HW NVENC</text>
      <text x="8" y="27" class="font-mono" font-size="7" fill="#64748b">1080p60</text>

      <rect x="89" width="82" height="34" rx="2" fill="#090d16" stroke="#00f0ff" stroke-width="0.8" />
      <text x="97" y="15" class="font-mono" font-size="8" fill="#00f0ff">DISCONNECT</text>
      <text x="97" y="27" class="font-mono" font-size="7" fill="#64748b">GUARD ARMED</text>

      <rect x="178" width="82" height="34" rx="2" fill="#090d16" stroke="#00ff88" stroke-width="0.8" />
      <text x="186" y="15" class="font-mono" font-size="8" fill="#00ff88">AAC-LC</text>
      <text x="186" y="27" class="font-mono" font-size="7" fill="#64748b">48kHz ST</text>

      <rect x="267" width="82" height="34" rx="2" fill="#090d16" stroke="#00ff88" stroke-width="0.8" />
      <text x="275" y="15" class="font-mono" font-size="8" fill="#00ff88">CPU LOAD</text>
      <text x="275" y="27" class="font-mono" font-size="7" fill="#64748b">&lt; 1.5% LOAD</text>
    </g>

    <text x="12" y="228" class="font-mono" font-size="8" fill="#38bdf8">1-Hz TICK TELEMETRY // MINIMAL OVERHEAD</text>
    <text x="12" y="240" class="font-mono" font-size="7" fill="#64748b">Static Struts cached · Zero-Copy Canvas Pipe fd 3</text>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM CENTER FLIGHT HORIZON / COMPASS HEADING TAPE                   -->
  <!-- ===================================================================== -->
  <g transform="translate(490, 685)">
    <path d="M 0 0 L 300 0 L 285 25 L 15 25 Z" fill="#060911" stroke="#1e293b" stroke-width="1" />
    <path d="M 15 0 L 285 0" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <text x="150" y="16" text-anchor="middle" class="font-mono" font-size="9" fill="#00f0ff" letter-spacing="0.15em">◄ 090° · HDG · 180° · SINK · 270° ►</text>
  </g>
</svg>
