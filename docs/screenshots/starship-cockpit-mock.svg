<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="deep-space-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Cockpit Structural Frame Gradient -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glass HUD Tint Gradient -->
    <linearGradient id="hud-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.01" />
    </linearGradient>

    <!-- Stream Video Area Simulation -->
    <linearGradient id="stream-video" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="hex-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 20 5 L 20 15 L 10 20 L 0 15 L 0 5 Z" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .hud-label { font-size: 9px; font-weight: 700; fill: #64748b; letter-spacing: 0.12em; text-transform: uppercase; }
    .hud-value { font-size: 13px; font-weight: 700; fill: #00f0ff; letter-spacing: 0.05em; }
    .hud-value-green { font-size: 13px; font-weight: 700; fill: #00ff88; letter-spacing: 0.05em; }
    .hud-title { font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>

  <!-- Deep Space Canvas Base -->
  <rect width="1280" height="720" fill="url(#deep-space-grad)" />

  <!-- Central Video Window (Simulated 9:16 TikTok Stream in 16:9 Canvas) -->
  <!-- 9:16 in 720p height: width = 720 * 9 / 16 = 405px. Centered at x = (1280 - 405)/2 = 437.5px -->
  <rect x="435" y="10" width="410" height="700" rx="2" fill="url(#stream-video)" stroke="#334155" stroke-width="1" />
  
  <!-- Video Window Crosshairs & Canopy Struts -->
  <path d="M 435 25 L 450 10 M 845 25 L 830 10 M 435 695 L 450 710 M 845 695 L 830 710" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <text x="640" y="360" text-anchor="middle" class="font-sans" font-size="16" font-weight="700" fill="#94a3b8" fill-opacity="0.6">9:16 LIVE STREAM CAM</text>
  <text x="640" y="385" text-anchor="middle" class="font-mono" font-size="11" fill="#64748b" fill-opacity="0.8">[ 100% UNVERDECKTES VIDEOFENSTER ]</text>

  <!-- ===================================================================== -->
  <!-- STATIC COCKPIT CANOPY FRAME (Layer 0 - Render Once & Cache)          -->
  <!-- ===================================================================== -->
  
  <!-- Left Pillar Cockpit Wing -->
  <path d="M 10 10 L 415 10 L 425 25 L 425 695 L 415 710 L 10 710 Z" fill="url(#frame-grad)" stroke="#1e293b" stroke-width="1" />
  <rect x="15" y="15" width="400" height="690" fill="url(#hex-grid)" />

  <!-- Right Pillar Cockpit Wing -->
  <path d="M 865 10 L 1270 10 L 1270 710 L 865 710 L 855 695 L 855 25 Z" fill="url(#frame-grad)" stroke="#1e293b" stroke-width="1" />
  <rect x="865" y="15" width="400" height="690" fill="url(#hex-grid)" />

  <!-- Top Center Canopy Visor -->
  <path d="M 470 10 L 810 10 L 800 35 L 480 35 Z" fill="#0b0f19" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="495" cy="22" r="3" fill="#00ff88" filter="url(#neon-cyan)" />
  <text x="510" y="26" class="font-mono" font-size="10" font-weight="700" fill="#00ff88">STARSHIP-HUD v1.0</text>
  <text x="660" y="26" class="font-mono" font-size="10" fill="#64748b">SYS: OPTIMAL</text>
  <text x="760" y="26" class="font-mono" font-size="10" font-weight="700" fill="#00f0ff">RTMP SINK</text>

  <!-- ===================================================================== -->
  <!-- LEFT PILLAR: COMMS RELAY (Chat Uplink Terminal)                       -->
  <!-- ===================================================================== -->
  <!-- Comms Header Bar -->
  <rect x="25" y="25" width="380" height="34" rx="2" fill="#090d16" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="40" cy="42" r="3" fill="#00f0ff" />
  <text x="52" y="46" class="font-mono hud-title">COMMS TERMINAL // CHAT UPLINK</text>
  <rect x="330" y="32" width="65" height="20" rx="2" fill="#1e293b" />
  <text x="362" y="46" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#00ff88">SECURE</text>

  <!-- Comms Messages Stack -->
  <!-- Message 1 -->
  <g transform="translate(25, 70)">
    <rect width="380" height="48" rx="2" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="20" class="font-mono" font-size="9" fill="#64748b">19:42:01</text>
    <rect x="68" y="9" width="34" height="15" rx="2" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
    <text x="85" y="20" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#60a5fa">VIP</text>
    <text x="110" y="20" class="font-sans" font-size="11" font-weight="700" fill="#38bdf8">Starlight_Cmdr</text>
    <text x="12" y="38" class="font-sans" font-size="11" fill="#e2e8f0">Orbit erreicht! Bild und Ton glasklar 🚀</text>
  </g>

  <!-- Message 2 -->
  <g transform="translate(25, 126)">
    <rect width="380" height="48" rx="2" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="20" class="font-mono" font-size="9" fill="#64748b">19:42:15</text>
    <rect x="68" y="9" width="34" height="15" rx="2" fill="#00ff88" fill-opacity="0.2" stroke="#00ff88" stroke-width="0.8" />
    <text x="85" y="20" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#00ff88">SUB</text>
    <text x="110" y="20" class="font-sans" font-size="11" font-weight="700" fill="#a78bfa">CosmicPilot</text>
    <text x="12" y="38" class="font-sans" font-size="11" fill="#e2e8f0">Wie lange läuft der Restream heute?</text>
  </g>

  <!-- Message 3 -->
  <g transform="translate(25, 182)">
    <rect width="380" height="48" rx="2" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="20" class="font-mono" font-size="9" fill="#64748b">19:42:30</text>
    <rect x="68" y="9" width="34" height="15" rx="2" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
    <text x="85" y="20" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#fbbf24">MOD</text>
    <text x="110" y="20" class="font-sans" font-size="11" font-weight="700" fill="#f43f5e">AstroRegie</text>
    <text x="12" y="38" class="font-sans" font-size="11" fill="#e2e8f0">Bis 23:00 Uhr, danach Playlist-Rotation.</text>
  </g>

  <!-- Message 4 -->
  <g transform="translate(25, 238)">
    <rect width="380" height="48" rx="2" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="20" class="font-mono" font-size="9" fill="#64748b">19:42:44</text>
    <text x="12" y="38" class="font-sans" font-size="11" fill="#cbd5e1">Herzlich willkommen an alle Neuankömmlinge!</text>
  </g>

  <!-- Comms Uplink Stats Box -->
  <g transform="translate(25, 620)">
    <rect width="380" height="75" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="15" y="22" class="font-mono hud-label">CHAT THROUGHPUT</text>
    <text x="15" y="42" class="font-mono hud-value">4.2 MSGS/SEC</text>
    <text x="210" y="22" class="font-mono hud-label">ACTIVE VIEWERS</text>
    <text x="210" y="42" class="font-mono hud-value-green">1,482 CREW</text>
    <!-- Uplink Activity Light -->
    <rect x="15" y="55" width="350" height="4" rx="2" fill="#1e293b" />
    <rect x="15" y="55" width="280" height="4" rx="2" fill="url(#cyan-glow)" />
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT PILLAR: STARSHIP TELEMETRY & POWER GRID                         -->
  <!-- ===================================================================== -->
  <!-- Telemetry Header Bar -->
  <rect x="875" y="25" width="380" height="34" rx="2" fill="#090d16" stroke="#00ff88" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="890" cy="42" r="3" fill="#00ff88" />
  <text x="902" y="46" class="font-mono hud-title">TELEMETRY // FLIGHT SYSTEMS</text>
  <rect x="1190" y="32" width="55" height="20" rx="2" fill="#1e293b" />
  <text x="1217" y="46" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#00f0ff">ONLINE</text>

  <!-- Mission Elapsed Time (MET) Gauge -->
  <g transform="translate(875, 70)">
    <rect width="380" height="60" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="font-mono hud-label">MISSION ELAPSED TIME (MET)</text>
    <text x="16" y="48" class="font-mono" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.08em">03:42:18.9</text>
    <text x="240" y="46" class="font-mono" font-size="11" fill="#00ff88">STATUS: STABLE</text>
  </g>

  <!-- Thrust / Bitrate & FPS Instruments -->
  <g transform="translate(875, 140)">
    <!-- Bitrate Gauge -->
    <rect width="185" height="90" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="22" class="font-mono hud-label">INGEST BITRATE</text>
    <text x="14" y="52" class="font-mono" font-size="20" font-weight="800" fill="#00f0ff">4,850</text>
    <text x="95" y="52" class="font-mono" font-size="11" fill="#64748b">kbps</text>
    <rect x="14" y="68" width="157" height="6" rx="2" fill="#1e293b" />
    <rect x="14" y="68" width="128" height="6" rx="2" fill="url(#cyan-glow)" />

    <!-- FPS Gauge -->
    <rect x="195" width="185" height="90" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="210" y="22" class="font-mono hud-label">OUTPUT FPS</text>
    <text x="210" y="52" class="font-mono" font-size="20" font-weight="800" fill="#00ff88">60.0</text>
    <text x="270" y="52" class="font-mono" font-size="11" fill="#64748b">CFR</text>
    <rect x="210" y="68" width="155" height="6" rx="2" fill="#1e293b" />
    <rect x="210" y="68" width="155" height="6" rx="2" fill="url(#green-glow)" />
  </g>

  <!-- Delay Buffer & Latency -->
  <g transform="translate(875, 240)">
    <rect width="380" height="70" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="font-mono hud-label">DELAY BUFFER PACING // CATCHUP 1.01X</text>
    <text x="16" y="48" class="font-mono hud-value">150 MS LATENCY</text>
    <text x="240" y="48" class="font-mono" font-size="11" fill="#00ff88">DRIFT: 0.00 MS</text>
    <!-- Segmented meter -->
    <rect x="16" y="58" width="50" height="4" fill="#00ff88" />
    <rect x="70" y="58" width="50" height="4" fill="#00ff88" />
    <rect x="124" y="58" width="50" height="4" fill="#00ff88" />
    <rect x="178" y="58" width="50" height="4" fill="#00ff88" />
    <rect x="232" y="58" width="50" height="4" fill="#00f0ff" />
    <rect x="286" y="58" width="50" height="4" fill="#1e293b" />
    <rect x="340" y="58" width="20" height="4" fill="#1e293b" />
  </g>

  <!-- Energy Grid & Earnings / Mission Goal -->
  <g transform="translate(875, 320)">
    <rect width="380" height="110" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="font-mono hud-label">POWER GRID // REVENUE &amp; MISSION GOAL</text>
    
    <text x="16" y="50" class="font-mono hud-label">TOKENS HARVESTED</text>
    <text x="16" y="74" class="font-mono hud-value-green">14,250 COINS</text>
    <text x="160" y="74" class="font-mono" font-size="12" fill="#cbd5e1">(74.81 €)</text>

    <text x="260" y="50" class="font-mono hud-label">PROGRESS</text>
    <text x="260" y="74" class="font-mono" font-size="14" font-weight="800" fill="#00f0ff">71 %</text>

    <!-- Big Futuristic Goal Progress Bar -->
    <rect x="16" y="88" width="348" height="10" rx="2" fill="#1e293b" />
    <rect x="16" y="88" width="247" height="10" rx="2" fill="url(#green-glow)" />
  </g>

  <!-- Starship Diagnostics & Warnings Box -->
  <g transform="translate(875, 440)">
    <rect width="380" height="170" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="font-mono hud-label">SYSTEM ANNUNCIATOR MATRIX</text>

    <!-- Annunciator Tiles -->
    <g transform="translate(16, 32)">
      <rect width="168" height="36" rx="2" fill="#0f172a" stroke="#00ff88" stroke-width="1" stroke-opacity="0.6" />
      <text x="10" y="18" class="font-mono" font-size="9" fill="#00ff88">NVENC HW ACCEL</text>
      <text x="10" y="30" class="font-mono" font-size="8" fill="#64748b">ACTIVE · 1080p60</text>

      <rect x="180" width="168" height="36" rx="2" fill="#0f172a" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6" />
      <text x="190" y="18" class="font-mono" font-size="9" fill="#00f0ff">DISCONNECT GUARD</text>
      <text x="190" y="30" class="font-mono" font-size="8" fill="#64748b">ARMED (2.0s GRACE)</text>

      <rect y="44" width="168" height="36" rx="2" fill="#0f172a" stroke="#00ff88" stroke-width="1" stroke-opacity="0.6" />
      <text x="10" y="62" class="font-mono" font-size="9" fill="#00ff88">AUDIO RESAMPLE</text>
      <text x="10" y="74" class="font-mono" font-size="8" fill="#64748b">AAC-LC 48kHz STEREO</text>

      <rect x="180" y="44" width="168" height="36" rx="2" fill="#0f172a" stroke="#00ff88" stroke-width="1" stroke-opacity="0.6" />
      <text x="190" y="62" class="font-mono" font-size="9" fill="#00ff88">CPU LOAD</text>
      <text x="190" y="74" class="font-mono" font-size="8" fill="#64748b">&lt; 1.2% CANVAS RENDER</text>
    </g>

    <!-- CPU-sparend Architecture Note in Mockup -->
    <text x="16" y="145" class="font-mono" font-size="9" fill="#38bdf8">RADICAL CPU-SPAR-MODUS:</text>
    <text x="16" y="158" class="font-mono" font-size="9" fill="#64748b">Canopy gerendert 1x · Delta-Updates bei 1Hz · 0% Stream-Verdeckung</text>
  </g>

  <!-- Footer Mission Control Bar -->
  <g transform="translate(875, 620)">
    <rect width="380" height="75" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" class="font-mono hud-label">FLIGHT CONTROLLER</text>
    <text x="16" y="46" class="font-mono hud-value">COCKPIT CANOPY ACTIVE</text>
    <text x="16" y="62" class="font-mono" font-size="9" fill="#64748b">OVERLAY fd 3 // ZERO-OVERHEAD DELTA BLIT</text>
  </g>
</svg>
