<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="video-sim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Banner Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="monitor-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="progress-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="badge-live-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .text-title { font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 0.04em; }
    .text-sub { font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .text-val { font-size: 12px; font-weight: 600; fill: #f8fafc; }
    .text-accent { font-size: 12px; font-weight: 700; fill: #00ff88; }
    .text-chat-user { font-size: 11px; font-weight: 700; fill: #38bdf8; }
    .text-chat-msg { font-size: 11px; font-weight: 400; fill: #e2e8f0; }
    .badge-text { font-size: 10px; font-weight: 800; fill: #ffffff; letter-spacing: 0.05em; }
  </style>

  <!-- 16:9 Stream Canvas Background -->
  <rect width="1280" height="720" fill="url(#bg-grad)" />

  <!-- Studio Grid Background -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0 120 L 1280 120 M 0 240 L 1280 240 M 0 360 L 1280 360 M 0 480 L 1280 480 M 0 600 L 1280 600" />
    <path d="M 160 0 L 160 720 M 320 0 L 320 720 M 480 0 L 480 720 M 640 0 L 640 720 M 800 0 L 800 720 M 960 0 L 960 720 M 1120 0 L 1120 720" />
  </g>

  <!-- ======================================================== -->
  <!-- 1. TOP BANNER: STREAM STATS & EARNINGS                   -->
  <!-- ======================================================== -->
  <g id="top-banner-overlay" transform="translate(16, 12)">
    <!-- Container -->
    <rect x="0" y="0" width="1248" height="56" rx="3" fill="url(#banner-bg)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#00ff88" filter="url(#neon-glow)" />

    <!-- Left: Status & Metriken -->
    <g transform="translate(16, 12)">
      <rect x="0" y="4" width="42" height="20" rx="2" fill="url(#badge-live-grad)" />
      <text x="21" y="18" class="font-sans badge-text" text-anchor="middle">LIVE</text>
      <text x="54" y="19" class="font-sans text-title">@creator_live</text>

      <g transform="translate(180, 5)">
        <text x="0" y="14" class="font-mono text-val">👤 1.842</text>
        <text x="75" y="14" class="font-mono text-val">❤️ 48.5k</text>
        <text x="155" y="14" class="font-mono text-accent">⏱ 02:14:35</text>
      </g>
    </g>

    <!-- Center Label: Modus-Hinweis -->
    <g transform="translate(560, 20)">
      <rect x="0" y="0" width="160" height="20" rx="2" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="0.8" />
      <text x="80" y="14" class="font-sans text-sub" text-anchor="middle" font-size="10">KOPFZEILE (STATS &amp; ZIEL)</text>
    </g>

    <!-- Right: Einnahmen & Spenden-Zielbalken -->
    <g transform="translate(850, 10)">
      <g transform="translate(0, 4)">
        <text x="0" y="14" class="font-sans text-sub">Einnahmen:</text>
        <text x="64" y="14" class="font-mono text-val">🪙 5.420</text>
        <text x="122" y="14" class="font-mono text-accent">· 47,50 €</text>
      </g>

      <g transform="translate(195, 2)">
        <text x="0" y="11" class="font-sans text-sub" font-size="10">Neuer Streaming-PC:</text>
        <text x="180" y="11" class="font-mono text-val" font-size="10" text-anchor="end">47 %</text>
        <rect x="0" y="16" width="180" height="6" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <rect x="0" y="16" width="84.6" height="6" rx="2" fill="url(#progress-bar-grad)" filter="url(#neon-glow)" />
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 2. LEFT SÄULE: CHAT-MONITOR (OPTIONAL LINKS)             -->
  <!-- ======================================================== -->
  <g id="left-chat-monitor" transform="translate(16, 78)">
    <!-- Monitor Outer Box -->
    <rect x="0" y="0" width="410" height="520" rx="3" fill="url(#monitor-bg)" stroke="#334155" stroke-width="1.2" />

    <!-- Monitor Header -->
    <rect x="0" y="0" width="410" height="34" rx="3" fill="#1e293b" fill-opacity="0.8" />
    <circle cx="16" cy="17" r="4" fill="#00ff88" />
    <text x="28" y="21" class="font-sans text-title" font-size="11">CHAT-MONITOR (LINKE SÄULE)</text>
    <rect x="320" y="8" width="76" height="18" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8" />
    <text x="358" y="21" class="font-mono text-sub" text-anchor="middle" font-size="9">MINIMAL O/H</text>

    <!-- Chat Messages Stack -->
    <!-- Message 1 -->
    <g transform="translate(12, 46)">
      <rect x="0" y="0" width="386" height="48" rx="2" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="18" class="font-mono text-sub" font-size="9">19:42</text>
      <rect x="42" y="7" width="28" height="14" rx="2" fill="#0284c7" />
      <text x="56" y="17" class="font-mono badge-text" text-anchor="middle" font-size="8">SUB</text>
      <text x="76" y="18" class="font-sans text-chat-user">Alex_99:</text>
      <text x="10" y="36" class="font-sans text-chat-msg">Mega Idee mit dem Chat-Monitor links!</text>
    </g>

    <!-- Message 2 -->
    <g transform="translate(12, 102)">
      <rect x="0" y="0" width="386" height="48" rx="2" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="18" class="font-mono text-sub" font-size="9">19:43</text>
      <text x="42" y="18" class="font-sans text-chat-user" fill="#a855f7">GamingFan:</text>
      <text x="10" y="36" class="font-sans text-chat-msg">Verdeckt so null vom eigentlichen Stream 🔥</text>
    </g>

    <!-- Message 3 -->
    <g transform="translate(12, 158)">
      <rect x="0" y="0" width="386" height="48" rx="2" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="18" class="font-mono text-sub" font-size="9">19:43</text>
      <rect x="42" y="7" width="28" height="14" rx="2" fill="#e11d48" />
      <text x="56" y="17" class="font-mono badge-text" text-anchor="middle" font-size="8">MOD</text>
      <text x="76" y="18" class="font-sans text-chat-user" fill="#f43f5e">Sarah_Mod:</text>
      <text x="10" y="36" class="font-sans text-chat-msg">Willkommen im Stream alle zusammen! 👋</text>
    </g>

    <!-- Message 4 -->
    <g transform="translate(12, 214)">
      <rect x="0" y="0" width="386" height="48" rx="2" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="18" class="font-mono text-sub" font-size="9">19:44</text>
      <text x="42" y="18" class="font-sans text-chat-user" fill="#10b981">Tobi_K:</text>
      <text x="10" y="36" class="font-sans text-chat-msg">Sound ist jetzt auch auf iOS perfekt crystal clear</text>
    </g>

    <!-- Message 5 -->
    <g transform="translate(12, 270)">
      <rect x="0" y="0" width="386" height="48" rx="2" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="18" class="font-mono text-sub" font-size="9">19:45</text>
      <rect x="42" y="7" width="36" height="14" rx="2" fill="#d97706" />
      <text x="60" y="17" class="font-mono badge-text" text-anchor="middle" font-size="8">VIP</text>
      <text x="84" y="18" class="font-sans text-chat-user" fill="#fbbf24">Chris_VIP:</text>
      <text x="10" y="36" class="font-sans text-chat-msg">100 Coins gespendet! 🎁</text>
    </g>

    <!-- Footer Note inside Monitor -->
    <g transform="translate(12, 480)">
      <text x="193" y="16" class="font-sans text-sub" text-anchor="middle" font-size="10">
        Nutzt die ungenutzte Pillarbox-Fläche (0 % Video-Cover)
      </text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. ZENTRUM: VERTIKALER 9:16 TIKTOK-HAUPTSTREAM           -->
  <!-- ======================================================== -->
  <g id="simulated-source" transform="translate(442, 78)">
    <rect x="0" y="0" width="396" height="520" rx="4" fill="url(#video-sim-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="198" cy="220" r="44" fill="#475569" opacity="0.4" />
    <polygon points="190,205 215,220 190,235" fill="#94a3b8" opacity="0.7" />
    <text x="198" y="290" class="font-sans text-title" text-anchor="middle" font-size="14" fill="#ffffff">
      9:16 LIVE-STREAM
    </text>
    <text x="198" y="312" class="font-sans text-sub" text-anchor="middle" font-size="11" fill="#94a3b8">
      100 % freie Sicht
    </text>
    <rect x="118" y="330" width="160" height="24" rx="2" fill="#00ff88" fill-opacity="0.1" stroke="#00ff88" stroke-opacity="0.3" />
    <text x="198" y="346" class="font-mono text-accent" text-anchor="middle" font-size="10">KEINE VERDECKUNG</text>
  </g>

  <!-- ======================================================== -->
  <!-- 4. RECHTE SÄULE: FREI / OPTIONAL WEITERE INFOS          -->
  <!-- ======================================================== -->
  <g id="right-pillarbox" transform="translate(854, 78)">
    <rect x="0" y="0" width="410" height="520" rx="3" fill="#0f172a" fill-opacity="0.4" stroke="#1e293b" stroke-dasharray="4 4" stroke-width="1.2" />
    <text x="205" y="250" class="font-sans text-sub" text-anchor="middle" font-size="12" fill="#64748b">
      Rechte Säule frei für
    </text>
    <text x="205" y="270" class="font-sans text-sub" text-anchor="middle" font-size="11" fill="#475569">
      Einnahmen-Historie, Logo oder Clean Video
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- 5. UNTEN: DESIGN-PRINZIPIEN & ARCHITEKTUR-HINWEIS        -->
  <!-- ======================================================== -->
  <g transform="translate(16, 610)">
    <rect width="1248" height="96" rx="4" fill="#0f172a" fill-opacity="0.95" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="28" class="font-sans" font-size="13" font-weight="700" fill="#38bdf8">
      LAYOUT-OPTION: Top-Banner + Chat-Monitor links (Zweite Wahl zum Standard, Minimaler Overhead)
    </text>
    <g transform="translate(24, 48)" class="font-sans" font-size="11" fill="#cbd5e1">
      <text x="0" y="0">
        <tspan fill="#00ff88" font-weight="700">✓ Minimaler Overhead:</tspan> Läuft vollständig im existierenden Canvas-Stream (fd 3); kein Extra-ffmpeg-Prozess, Re-Draw nur bei neuen Chat-Events.
      </text>
      <text x="0" y="24">
        <tspan fill="#38bdf8" font-weight="700">✓ Zweite Wahl / Optional:</tspan> Das bisherige frei verschiebbare Standard-Overlay bleibt Default; der Monitor-Modus ist als Layout wählbar.
      </text>
      <text x="640" y="0">
        <tspan fill="#f59e0b" font-weight="700">✓ Nutzt tote Säulen (Pillarbox):</tspan> Die schwarzen Balken bei 16:9-Streams mit 9:16-Quelle werden produktiv genutzt.
      </text>
      <text x="640" y="24">
        <tspan fill="#a855f7" font-weight="700">✓ Getrennte Bereiche:</tspan> Kopfzeile für Zahlen/Stats, linke Säule für Chat – klare visuelle Trennung.
      </text>
    </g>
  </g>
</svg>
