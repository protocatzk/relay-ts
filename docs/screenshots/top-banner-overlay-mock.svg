<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="video-sim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Banner Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="progress-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="badge-live-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .text-title { font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 0.04em; }
    .text-sub { font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .text-val { font-size: 12px; font-weight: 600; fill: #f8fafc; }
    .text-accent { font-size: 12px; font-weight: 700; fill: #00ff88; }
    .text-chat-user { font-size: 12px; font-weight: 700; fill: #38bdf8; }
    .text-chat-msg { font-size: 12px; font-weight: 400; fill: #e2e8f0; }
    .badge-text { font-size: 10px; font-weight: 800; fill: #ffffff; letter-spacing: 0.05em; }
  </style>

  <!-- 16:9 Stream Canvas Background -->
  <rect width="1280" height="720" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay for Studio Feel -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M 0 120 L 1280 120 M 0 240 L 1280 240 M 0 360 L 1280 360 M 0 480 L 1280 480 M 0 600 L 1280 600" />
    <path d="M 160 0 L 160 720 M 320 0 L 320 720 M 480 0 L 480 720 M 640 0 L 640 720 M 800 0 L 800 720 M 960 0 L 960 720 M 1120 0 L 1120 720" />
  </g>

  <!-- Simulated 9:16 Mobile Content in Center -->
  <g id="simulated-source">
    <rect x="460" y="80" width="360" height="640" rx="4" fill="url(#video-sim-grad)" stroke="#334155" stroke-width="1.5" />
    <!-- Placeholder Graphic for Live Video -->
    <circle cx="640" cy="360" r="48" fill="#475569" opacity="0.4" />
    <polygon points="630,340 660,360 630,380" fill="#94a3b8" opacity="0.6" />
    <text x="640" y="440" class="font-sans text-sub" text-anchor="middle" font-size="13" fill="#cbd5e1">
      Vertikaler 9:16 TikTok-Stream
    </text>
    <text x="640" y="460" class="font-sans text-sub" text-anchor="middle" font-size="11" fill="#64748b">
      (volle Sichtbarkeit ohne störende Seiten-Overlays)
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- TOP BANNER OVERLAY CONTAINER (64px height)                -->
  <!-- ======================================================== -->
  <g id="top-banner-overlay" transform="translate(16, 12)">
    <!-- Banner Shadow & Border -->
    <rect x="0" y="0" width="1248" height="60" rx="3" fill="url(#banner-bg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Left Indicator Strip (TokTracker Accent) -->
    <rect x="0" y="0" width="4" height="60" rx="2" fill="#00ff88" filter="url(#neon-glow)" />

    <!-- ======================================================== -->
    <!-- SECTION 1: LIVE STATUS & STREAM STATS (Left)             -->
    <!-- ======================================================== -->
    <g id="banner-stats" transform="translate(16, 14)">
      <!-- Live Badge -->
      <rect x="0" y="4" width="44" height="22" rx="2" fill="url(#badge-live-grad)" />
      <text x="22" y="19" class="font-sans badge-text" text-anchor="middle">LIVE</text>

      <!-- Streamer Handle -->
      <text x="56" y="20" class="font-sans text-title">@creator_live</text>

      <!-- Stats Indicators -->
      <g transform="translate(180, 5)">
        <!-- Viewers -->
        <circle cx="6" cy="11" r="3" fill="#38bdf8" />
        <path d="M 2 19 C 2 16, 10 16, 10 19" stroke="#38bdf8" stroke-width="1.2" fill="none" />
        <text x="18" y="15" class="font-mono text-val">1.842</text>
        <text x="58" y="15" class="font-sans text-sub">Zuschauer</text>

        <!-- Divider -->
        <line x1="126" y1="4" x2="126" y2="18" stroke="#334155" stroke-width="1" />

        <!-- Likes -->
        <path d="M 142 9 A 3 3 0 0 0 136 12 A 3 3 0 0 0 142 16 L 142 16 L 148 10 A 3 3 0 0 0 142 9" fill="#f43f5e" />
        <text x="156" y="15" class="font-mono text-val">48.5k</text>
        <text x="198" y="15" class="font-sans text-sub">Likes</text>

        <!-- Divider -->
        <line x1="238" y1="4" x2="238" y2="18" stroke="#334155" stroke-width="1" />

        <!-- Uptime -->
        <text x="250" y="15" class="font-mono text-accent">02:14:35</text>
      </g>
    </g>

    <!-- Vertical Separator between Stats & Chat -->
    <line x1="480" y1="10" x2="480" y2="50" stroke="#334155" stroke-width="1" />

    <!-- ======================================================== -->
    <!-- SECTION 2: CHAT TICKER / MARQUEE (Center)                -->
    <!-- ======================================================== -->
    <g id="banner-chat" transform="translate(496, 15)">
      <!-- Chat Sub-Pill Container -->
      <rect x="0" y="0" width="370" height="30" rx="3" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8" />

      <!-- Chat Bubble Icon -->
      <path d="M 12 11 C 12 8, 24 8, 24 11 C 24 14, 18 14, 16 16 L 14 18 L 14 14 C 12 14, 12 11, 12 11" fill="#38bdf8" opacity="0.8" />

      <!-- Badge [Sub] -->
      <rect x="28" y="7" width="28" height="16" rx="2" fill="#0284c7" />
      <text x="42" y="19" class="font-mono badge-text" text-anchor="middle" font-size="9">SUB</text>

      <!-- Username & Message -->
      <text x="62" y="20" class="font-sans text-chat-user">Alex_99:</text>
      <text x="122" y="20" class="font-sans text-chat-msg">Mega sauber mit dem Top-Banner! 🔥</text>
    </g>

    <!-- Vertical Separator between Chat & Earnings -->
    <line x1="882" y1="10" x2="882" y2="50" stroke="#334155" stroke-width="1" />

    <!-- ======================================================== -->
    <!-- SECTION 3: EARNINGS & GOAL PROGRESS (Right)              -->
    <!-- ======================================================== -->
    <g id="banner-earnings" transform="translate(898, 11)">
      <!-- Coins & EUR Summary -->
      <g transform="translate(0, 4)">
        <text x="0" y="14" class="font-sans text-sub">Einnahmen:</text>
        <text x="64" y="14" class="font-mono text-val">🪙 5.420</text>
        <text x="122" y="14" class="font-mono text-accent">· 47,50 €</text>
      </g>

      <!-- Goal Progress Bar -->
      <g transform="translate(185, 2)">
        <text x="0" y="11" class="font-sans text-sub" font-size="10">Neuer Streaming-PC:</text>
        <text x="160" y="11" class="font-mono text-val" font-size="10" text-anchor="end">47 %</text>
        
        <!-- Track -->
        <rect x="0" y="16" width="160" height="7" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <!-- Fill (47%) -->
        <rect x="0" y="16" width="75.2" height="7" rx="2" fill="url(#progress-bar-grad)" filter="url(#neon-glow)" />
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- ANNOTATION / FEATURE HIGHLIGHTS (Bottom Overlay Card)    -->
  <!-- ======================================================== -->
  <g transform="translate(16, 610)">
    <rect width="1248" height="96" rx="4" fill="#0f172a" fill-opacity="0.92" stroke="#1e293b" stroke-width="1" />
    
    <!-- Title -->
    <text x="24" y="28" class="font-sans" font-size="14" font-weight="700" fill="#38bdf8">
      FEATURE-MOCKUP: Integriertes Top-Banner (#68)
    </text>
    
    <!-- Bullet Points -->
    <g transform="translate(24, 48)" class="font-sans" font-size="12" fill="#cbd5e1">
      <text x="0" y="0">
        <tspan fill="#00ff88" font-weight="700">1. Stream-Status &amp; Metriken:</tspan> Live-Indikator, Handle, Viewer-Count, Likes und Uptime auf einen Blick.
      </text>
      <text x="0" y="24">
        <tspan fill="#38bdf8" font-weight="700">2. Chat-Ticker (Mitte):</tspan> Einzeiliger Nachrichten-Ticker (Marquee oder weicher Blendenwechsel) spart bis zu 400 px Seitenbreite.
      </text>
      <text x="640" y="0">
        <tspan fill="#f59e0b" font-weight="700">3. Einnahmen &amp; Spendenziel (Rechts):</tspan> Coins/EUR-Zähler und Fortschrittsbalken direkt integriert.
      </text>
      <text x="640" y="24">
        <tspan fill="#a855f7" font-weight="700">4. Volle Content-Fläche:</tspan> 9:16-Handy-Streams und 16:9-Inhalte bleiben im Hauptbereich 100 % unverdeckt.
      </text>
    </g>
  </g>
</svg>
