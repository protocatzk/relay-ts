    <text x="24" y="818">Mobil: Signaling-Dot in der Bottom-Nav (Stream läuft), Swipe-Aktionen auf Queue-Einträgen, Back-Gesten überall lauffähig</text>
    <text x="24" y="836">Global: Topbar mit Marke, Discovery-Suche, ⌘K-Palette und Konto · Discovery integriert als Such-/Zapper-Modus in Live — kein eigener Nav-Punkt mehr</text>
    <text x="24" y="854">Design: Radius 12 px Karten / 8 px Controls / Pill-Chips, Elevation statt 1-px-Borders, Cyan als Interaktions-Akzent, JetBrains Mono nur für Zahlen/IDs · Mock, kein Screenshot</text>
